[project]
name = "quizzly-api"
version = "0.1.0"
description = "Quizzly API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pypdfium2>=5.14.0",
    "python-pptx>=1.0.2",
    "fastembed>=0.9.0",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
    "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: no account needed; safe on production after every deploy (e2e/)",
    "security: probes with throwaway accounts, no AI calls (e2e/)",
    "journey: the whole student journey with real AI calls; needs a worker (e2e/)",
    "slow: takes a minute or more",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
