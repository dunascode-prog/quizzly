# LLM routing. Providers are tried in order; on 429/5xx the gateway falls through.
# Model names change often on free tiers: update here, never in code.
# Last checked against each provider's model list: 2026-10-22.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  cloudflare:
    base_url: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1
    api_key_env: CLOUDFLARE_API_TOKEN

profiles:
  chat:      # streamed answers: thinking off on Groq so the first token comes quickly (FR-CHAT-04)
    - { provider: groq, model: qwen/qwen3.8-27b, rpm: 30, params: { reasoning_effort: none } }
    - { provider: openrouter, model: "google/gemma-4-26b-a4b-it:free", rpm: 20 }
    - { provider: cloudflare, model: "@cf/meta/llama-3.1-8b-instruct-fp8", rpm: 50 }
  fast:      # marking
    - { provider: groq, model: qwen/qwen3.8-27b, rpm: 30 }
    - { provider: openrouter, model: "google/gemma-4-26b-a4b-it:free", rpm: 20 }
    - { provider: cloudflare, model: "@cf/meta/llama-3.1-8b-instruct-fp8", rpm: 50 }
  questions: # low reasoning effort keeps big sets fast; Groq limits tokens per minute per model, so
             # two more Groq models take over before the much slower free fallbacks
    - { provider: groq, model: openai/gpt-oss-120b, rpm: 30, params: { reasoning_effort: low } }
    - { provider: groq, model: qwen/qwen3.8-27b, rpm: 30, params: { reasoning_effort: none } }
    - { provider: groq, model: openai/gpt-oss-20b, rpm: 30, params: { reasoning_effort: low } }
    - { provider: openrouter, model: "google/gemma-4-31b-it:free", rpm: 20 }
    - { provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast", rpm: 50 }
  quality:   # explanations, outlines
    - { provider: groq, model: openai/gpt-oss-120b, rpm: 30 }
    - { provider: openrouter, model: "google/gemma-4-31b-it:free", rpm: 20 }
    - { provider: cloudflare, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast", rpm: 50 }

tasks:
  chat: chat
  marking: fast
  outline: quality
  explanation: quality
  questions: questions
