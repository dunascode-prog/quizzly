# One environment (staging or production) of the API and worker on the Oracle Cloud Always Free VM
# (ARCHITECTURE §1). CI runs it with a prebuilt image through deploy.sh; see README.md.
# Caddy runs once for both environments (edge/) and reaches the API over the quizzly-edge network.
services:
  api:
    image: ${API_IMAGE:-quizzly-api:local}
    env_file: ${ENV_FILE:-.env}
    environment:
      RELEASE: ${RELEASE:-}
    restart: unless-stopped
    expose: ["8000"]
    networks:
      default:
      edge:
        aliases: ["api-${QUIZZLY_ENV:-local}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${API_IMAGE:-quizzly-api:local}
    env_file: ${ENV_FILE:-.env}
    environment:
      RELEASE: ${RELEASE:-}
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    # A job cut off mid-run is retried as crashed (0007); let the current one finish first.
    stop_grace_period: 60s

networks:
  edge:
    name: quizzly-edge
    external: true
