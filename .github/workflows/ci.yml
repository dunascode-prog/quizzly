name: CI

# Runs on every pull request, and from deploy.yml before anything ships (see docs/CI_CD.md).
# Make every job here a required check on main so nothing merges red.
on:
  pull_request:
    # labeled/unlabeled so adding `destructive-migration` re-runs migration-rules.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # NFR-11: on a pull request that changes prompts, the RAG pipeline or model routing, run the
  # evaluation set against the real models and fail if quality drops below evals/thresholds.json.
  evals:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did prompts or the pipeline change?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD"             | grep -qE '^(services/api/prompts/|services/api/app/rag/|services/api/config/models.yaml|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prompt or pipeline changes; evals skipped."
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.run == 'true'
      - run: uv sync
        if: steps.changed.outputs.run == 'true'
      - name: Run the evaluation set
        if: steps.changed.outputs.run == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GROQ_API_KEY$OPENROUTER_API_KEY$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No LLM keys in the repository secrets, so the evaluation set didn't run."
            exit 0
          fi
          uv run python ../../evals/run.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with: { name: eval-report, path: "evals/report.*", if-no-files-found: ignore }

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx expo-doctor

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Stub Supabase auth/storage schemas and apply migrations
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users (id uuid primary key, raw_user_meta_data jsonb);
          create function auth.uid() returns uuid language sql as 'select null::uuid';
          create schema storage;
          create table storage.buckets (id text primary key, name text, public boolean, file_size_limit bigint);
          SQL
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; done

  # Applied migrations never change, and new ones must not break the code that's still running:
  # deploys migrate first and can roll the code back, but never the schema (docs/CI_CD.md §4).
  migration-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Migrations are append-only and safe to roll back over
        env:
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed=$(git diff --name-status --no-renames "$BASE...HEAD" -- supabase/migrations)
          if echo "$changed" | grep -qE '^[MD]'; then
            echo "::error::An applied migration was edited or deleted. Add a new numbered file instead."
            echo "$changed"
            exit 1
          fi
          dupes=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Two migrations share the number $dupes."
            exit 1
          fi
          added=$(echo "$changed" | awk '$1 == "A" { print $2 }')
          [ -z "$added" ] && { echo "No new migrations."; exit 0; }
          max=$(git ls-tree --name-only "$BASE" supabase/migrations/ | sed -n 's#.*/\([0-9]*\)_.*#\1#p' | sort -n | tail -1)
          for f in $added; do
            n=$(basename "$f" | cut -d_ -f1)
            if ! [[ $n =~ ^[0-9]+$ ]] || (( 10#$n <= 10#${max:-0} )); then
              echo "::error file=$f::Number new migrations after ${max} (e.g. $(printf '%04d' $((10#${max:-0} + 1)))_name.sql)."
              exit 1
            fi
          done
          pattern='\b(drop[[:space:]]+(table|column|schema|type|function|view)|rename[[:space:]]+(to|column)|alter[[:space:]]+column[[:space:]]+[^[:space:]]+[[:space:]]+(type|set[[:space:]]+not[[:space:]]+null)|truncate)\b'
          if grep -inE "$pattern" $added; then
            if [[ ",$LABELS," == *",destructive-migration,"* ]]; then
              echo "::warning::Destructive migration allowed by the destructive-migration label."
            else
              echo "::error::This migration drops, renames or tightens something the running code may use, so a"
              echo "::error::rollback would break. Split it: ship the code that stops using it first, drop it in a"
              echo "::error::later release, and add the destructive-migration label to that PR."
              exit 1
            fi
          fi

  # Secrets anywhere in git history, and Semgrep's high-severity rules for Python and TypeScript.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets (gitleaks)
        env: { GITLEAKS_VERSION: 8.30.1 }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - uses: astral-sh/setup-uv@v5
      - name: Code (semgrep)
        run: |
          uvx --from semgrep==1.182.1 semgrep scan --metrics off --error --severity ERROR \
            --config p/python --config p/typescript --config p/react services apps

  # The image builds for the VM's ARM CPU. Pull requests only: deploy.yml builds and pushes it.
  api-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=api
