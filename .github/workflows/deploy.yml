name: Deploy

# Merges to main go to staging by themselves; a v* tag on a main commit goes to production after an
# approval on the `production` environment. Every run passes CI first. See docs/CI_CD.md.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  plan:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.plan.outputs.image }}
      mobile: ${{ steps.plan.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Production releases only what has been through main (and so through staging).
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME isn't on main. Tag a commit that has been merged."
              exit 1
            fi
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          elif [[ $BEFORE =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null \
            || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/mobile; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [ci, plan]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          platforms: linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  staging:
    if: github.ref == 'refs/heads/main'
    needs: [plan, image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image: ${{ needs.plan.outputs.image }}
      mobile: ${{ needs.plan.outputs.mobile == 'true' }}
      eas-profile: preview
    secrets: inherit

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image: ${{ needs.plan.outputs.image }}
      mobile: true
      eas-profile: production
    secrets: inherit
